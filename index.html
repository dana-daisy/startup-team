<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 스타트업 시뮬레이터</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div class="app-container">
        <header class="top-bar">
            <div class="company-info">
                <h1>🚀 AI 스타트업</h1>
                <div class="date-time" id="dateTime"></div>
            </div>
            <div class="balance">
                <span class="money">💰 ₩<span id="balance">1,000,000</span></span>
            </div>
        </header>

        <main class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="dashboard" id="dashboard">
                <h2>📊 팀 현황</h2>
                <div class="agents-status" id="agentsStatus"></div>
                <div class="project-progress">
                    <h3>🎯 프로젝트 진행률</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="projectProgress"></div>
                    </div>
                    <span id="progressText">0%</span>
                </div>
            </div>
        </main>

        <footer class="log-panel">
            <h3>📝 활동 로그</h3>
            <div class="log-content" id="logContent">
                <div class="log-entry">시스템을 초기화하는 중...</div>
            </div>
        </footer>
    </div>

    <!-- 프로필 팝업 -->
    <div class="profile-popup" id="profilePopup" style="display:none;">
        <div class="profile-card">
            <div class="profile-close" id="profileClose">✕</div>
            <div class="profile-avatar" id="profileAvatar"></div>
            <div class="profile-name" id="profileName"></div>
            <div class="profile-role" id="profileRole"></div>
            <div class="profile-personality" id="profilePersonality"></div>
            <div class="profile-task" id="profileTask"></div>
        </div>
    </div>

    <div class="speech-bubble" id="speechBubble" style="display:none;">
        <div class="bubble-content"></div>
    </div>

    <script src="agents.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('SW 등록됨'))
                .catch(err => console.log('SW 실패', err));
        }
    </script>
</body>
</html>
